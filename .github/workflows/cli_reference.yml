name: CLI reference

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: cli-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: manual and flag tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      # The check reads the built binary. It does not build one itself:
      # a nested cargo while this step's cargo is running waits on the
      # same target lock.
      - name: Build the CLI
        run: cargo build --locked -p vissue-cli --bin vissue
      - name: The manual and the reference match the CLI
        run: cargo run --locked -q -p xtask -- docs --check --bin target/debug/vissue
