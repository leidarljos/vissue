name: crates.io

on:
  # cargo-dist calls this from Release after the GitHub release exists.
  # crates.io pins the JWT workflow filename. A tag call presents as
  # release.yml; workflow_dispatch presents as this file. Both must be
  # pinned on every crate.
  workflow_call:
    inputs:
      plan:
        description: 'cargo-dist plan JSON from the Release plan job'
        required: true
        type: string
      dry_run:
        description: 'Mint the token and package, but upload nothing'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to publish (defaults to the triggering ref)'
        required: false
        type: string
      dry_run:
        description: 'Mint the token and package, but upload nothing'
        required: false
        default: true
        type: boolean

concurrency:
  group: crates-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  package:
    name: Verify crate packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: HUD system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev

      # Builds each packaged tarball exactly as `cargo publish` would, so a
      # crate that cannot be consumed from the registry fails here rather
      # than after an irreversible upload. Every crate is packaged against
      # its siblings' local paths, because the versions they depend on are
      # not on the registry until this run puts them there.
      - name: Package
        run: |
          set -euo pipefail
          mapfile -t crates < <(cargo run -q -p xtask -- publish-order)
          echo "publishing order: ${crates[*]}"
          for target in "${crates[@]}"; do
            args=()
            for dep in "${crates[@]}"; do
              [ "$dep" = "$target" ] && continue
              args+=(--config "patch.crates-io.$dep.path=\"$GITHUB_WORKSPACE/crates/$dep\"")
            done
            echo "::group::package $target"
            cargo "${args[@]}" publish --dry-run --locked -p "$target"
            echo "::endgroup::"
          done

  publish:
    name: Publish to crates.io
    needs: [package]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: crates-io
      url: https://crates.io/crates/vissue-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # The tag names the version, so a tag that disagrees with the manifest
      # would publish something nobody asked for.
      - name: Validate the tag against the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(sed -n '0,/^version = /s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          test -n "$version"
          test "v$version" = "${GITHUB_REF_NAME}"

      # Trusted publishing: exchange this job's OIDC identity for a token
      # that lives only for the length of the run. crates.io accepts it
      # because the registry side pins this repository, the JWT workflow
      # filename (release.yml on a tag call, this file on dispatch), and
      # the environment above; a mismatch fails here rather than reaching
      # for a long-lived credential.
      - name: Mint a trusted-publishing token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Dependency order, computed from the manifests rather than written
      # out here: a crate names its siblings by version, so the registry has
      # to hold each one before the next resolves. The wait between uploads
      # is that propagation and nothing else.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          version=$(sed -n '0,/^version = /s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          test -n "$version"
          mapfile -t crates < <(cargo run -q -p xtask -- publish-order)
          echo "publishing order: ${crates[*]}"
          UA='vissue-publish (rgoswami@ieee.org)'
          crate_visible() {
            curl -fsS -A "$UA" "https://crates.io/api/v1/crates/$1/$version" >/dev/null 2>&1
          }
          for crate in "${crates[@]}"; do
            echo "::group::publish $crate"
            if crate_visible "$crate"; then
              echo "$crate@$version already on crates.io, skip"
              echo "::endgroup::"
              continue
            fi
            cargo publish --locked -p "$crate" $DRY_RUN
            echo "::endgroup::"
            if [ -n "$DRY_RUN" ]; then
              continue
            fi
            for _ in $(seq 1 36); do
              if crate_visible "$crate"; then
                break
              fi
              sleep 10
            done
            if ! crate_visible "$crate"; then
              echo "timeout waiting for $crate@$version" >&2
              exit 1
            fi
          done
