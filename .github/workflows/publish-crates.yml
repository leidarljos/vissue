name: Publish crates

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ !github.event.release.prerelease && vars.PUBLIC_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-22.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88"
      - name: Validate release tag
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          test "v$version" = "${{ github.event.release.tag_name }}"
      - name: Validate all packages
        shell: bash
        run: |
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo publish --locked --dry-run -p vissue-core
          core_patch='patch.crates-io.vissue-core.path="${{ github.workspace }}/crates/vissue-core"'
          cargo --config "$core_patch" publish --locked --dry-run -p vissue-cli
          cargo --config "$core_patch" publish --locked --dry-run -p vissue-mcp
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish --locked -p vissue-core
          cargo publish --locked -p vissue-cli
          cargo publish --locked -p vissue-mcp
