name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Builds the release for a tag that already exists, with this workflow and the tag's own source.
  # The tag is not moved.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, such as v0.4.0"
        required: true
        type: string

# Workflow permissions stay read-only.
# The release job writes contents and attestations.
# The publish job grants id-token for the crates workflow.
permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Push workflows that run on every commit to main and develop.
  # docs.yml is path-filtered, so a green commit need not have a docs run.
  # A tag does not start these; the release waits until each has a green run on the tagged commit.
  CI_WORKFLOWS: |
    ci_test.yml
    ci_prek.yml
    ci_newsfragments.yml
    cli_reference.yml
  # iced links libxkbcommon on Linux.
  # The Test workflow installs this package before it builds vissue-hud.
  LINUX_PACKAGES: libxkbcommon-dev

jobs:
  ci:
    # Waiting for the four CI workflows on this commit finishes inside an hour.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: The tag names a release
        run: |
          set -eu
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: CI on this commit is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          # Newest run for this commit.
          # `gh run list` orders newest first, and one run is the run this tag has to follow.
          while IFS= read -r workflow; do
            [ -n "$workflow" ] || continue
            id=$(gh run list --commit "$sha" --workflow "$workflow" --limit 1 \
              --json databaseId --jq '.[0].databaseId')
            if [ -z "$id" ] || [ "$id" = "null" ]; then
              echo "no ${workflow} run for ${sha}" >&2
              exit 1
            fi
            gh run watch "$id" --exit-status
          done <<< "$CI_WORKFLOWS"

  build:
    # Building the three release binaries on one runner finishes inside an hour.
    timeout-minutes: 60
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # rust-toolchain.toml pins the compiler, and cargo builds with the pin whatever the action sets as default.
      # The target goes on the pin, and so do the components the pin lists, so rustup adds none on the first cargo call.
      - name: The pinned toolchain
        id: pin
        run: |
          set -eu
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components *= *\[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d ' "')
          test -n "$channel"
          test -n "$components"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          targets: ${{ matrix.target }}
          components: ${{ steps.pin.outputs.components }}
      - name: The target is installed for the pin
        run: rustup target list --installed | grep -qx "$TARGET"
      - name: HUD system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends "$LINUX_PACKAGES"
      - run: cargo build --locked --release --target "$TARGET" -p vissue-cli -p vissue-mcp -p vissue-hud
      - name: Archive
        run: |
          set -eu
          name="vissue-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/vissue" \
            "target/${TARGET}/release/vissue-mcp" \
            "target/${TARGET}/release/vissue-hud" \
            "dist/$name/"
          cp README.md CHANGELOG.md LICENSE* "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    # Attesting the archives and publishing the GitHub release finishes inside twenty minutes.
    timeout-minutes: 20
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # This job's attestation says the workflow built each archive.
      # `gh attestation verify` and the ljos installer check that statement.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # This job's attestation says the workflow built each archive.
      # `gh attestation verify` and the ljos installer check that statement.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Release notes from the changelog
        run: |
          set -eu
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## /{if(p) exit} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The tag is already on the commit. A re-run edits the notes and replaces the archives.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --clobber

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/publish-crates.yml
    permissions:
      contents: read
      id-token: write
