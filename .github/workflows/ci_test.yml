name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25

  quality:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: HUD system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  rustdoc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: HUD system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - name: Rustdoc
        run: cargo doc --locked --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Rust 1.89 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: HUD system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - name: Locked all-targets check
        # rust-toolchain.toml is rustup priority 4 and would win over
        # `rustup default 1.89.0`. The +toolchain selector is priority 1.
        run: cargo +1.89.0 check --locked --workspace --all-targets

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: HUD system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - name: Workspace tests
        # --no-fail-fast: a red run should name every broken target, not
        # stop at the first. Without it the crates after the failure are
        # never run, and the report reads as though they passed.
        run: cargo test --locked --workspace --no-fail-fast

  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@60c08ce81d769135aafd96f96efc85993d9cb8e4
      - name: HUD system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      # Collect once, then report twice: the summary always prints, so a
      # gate failure says which files moved and by how much instead of
      # exiting 1 with nothing to read.
      # iced chrome (app/view/bin) is ignored so the 89% line gate does not
      # sink on event-loop drawing. --lib tests cover wire, summon, fuzzy,
      # attach, and offline. Do not lower 89.
      - name: Collect coverage
        run: cargo llvm-cov --locked --workspace --all-targets --no-report --ignore-filename-regex 'crates/vissue-hud/src/(app|view|bin)\.rs$'
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only --ignore-filename-regex 'crates/vissue-hud/src/(app|view|bin)\.rs$'
      - name: Generate LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info --fail-under-lines 89 --ignore-filename-regex 'crates/vissue-hud/src/(app|view|bin)\.rs$'
      - name: Upload LCOV artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vissue-lcov
          path: lcov.info
          if-no-files-found: error

  docs:
    name: the site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      # The exporter prefers pandoc and falls back to Emacs. Only the
      # preferred path is installed here: the fallback exists for hosts
      # without pandoc, and this host has one.
      - name: Pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - name: Export org and build the site
        run: |
          set -euo pipefail
          bash docs/scripts/export_org_to_rst.sh
          python -m pip install -q -r docs/requirements.txt
          # -n is nitpicky: an org link that exported into a role sphinx
          # cannot resolve is a dead link on the published page.
          sphinx-build -b html -n -W docs/source docs/build

  org-interop:
    name: Emacs reads what vissue writes
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox
      - name: Build the release binary
        run: cargo build --locked --release --bin vissue
      - name: Org interop
        run: bash tests/org_interop.sh ./target/release/vissue
      - name: Every fixture file lints as Org
        run: |
          set -euo pipefail
          for f in tests/fixture_vault/Software/*/*.org; do
            out=$(emacs --batch -Q --eval "(progn
                (require 'org-lint)
                (find-file \"$f\")
                (org-mode)
                (let ((r (org-lint)))
                  (if r
                      (dolist (x r) (princ (format \"%s\n\" (aref (cadr x) 2))))
                    (princ \"\"))))" 2>/dev/null)
            if [ -n "$out" ]; then
              echo "org-lint findings in $f: $out" >&2
              exit 1
            fi
          done

  windows:
    name: windows-msvc check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # cargo-dist builds this triple on a tag. Ubuntu jobs never see
      # target.'cfg(unix)' dropping notify, so a From<notify::Error> on
      # the always-on error module only fails here.
      - name: Locked workspace check
        run: cargo check --locked --workspace

  cli-smoke:
    name: CLI smoke over the fixture tracker
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build the release binary
        run: cargo build --locked --release --bin vissue
      - name: Query and validate the fixture tracker
        run: |
          set -euo pipefail
          BIN=./target/release/vissue
          "$BIN" --version
          test "$("$BIN" --root tests/fixture_vault count)" = "6"
          test "$("$BIN" --root tests/fixture_vault count --ready)" = "3"
          "$BIN" --root tests/fixture_vault check
          "$BIN" --root tests/fixture_vault export | while read -r line; do
            printf '%s' "$line" | python3 -c 'import json,sys; json.load(sys.stdin)'
          done
      - name: The working set and the consensus answer over the fixture
        run: |
          set -euo pipefail
          BIN=./target/release/vissue
          # Both are reads. The last step of this job diffs the fixture, so
          # running them here is also what proves they stay reads.
          "$BIN" --root tests/fixture_vault recall atlas-3e4f
          "$BIN" --root tests/fixture_vault recall atlas-3e4f --json |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["id"]=="atlas-3e4f", d'
          "$BIN" --root tests/fixture_vault recall atlas-3e4f --deeds-only
          "$BIN" --root tests/fixture_vault consensus atlas-3e4f
          "$BIN" --root tests/fixture_vault consensus atlas-3e4f --json |
            python3 -c 'import json,sys; json.load(sys.stdin)'

      - name: The join walks backwards from a product
        run: |
          set -euo pipefail
          BIN=./target/release/vissue
          "$BIN" --root tests/fixture_vault backlinks deed-patch-config-key |
            grep -q 'atlas-4g5h .*(cites)'
          "$BIN" --root tests/fixture_vault backlinks deed-patch-config-key --json |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert [r["relation"] for r in d] == ["cites"], d'
          # A product nobody cited is an empty answer; an unknown id is not.
          test -z "$("$BIN" --root tests/fixture_vault backlinks deed-quote-unused)"
          ! "$BIN" --root tests/fixture_vault backlinks atlas-zzzz

      - name: Mirror is regenerable and unchanged on a second run
        run: |
          set -euo pipefail
          BIN=./target/release/vissue
          "$BIN" --root tests/fixture_vault mirror --out /tmp/mirror-a.org
          "$BIN" --root tests/fixture_vault mirror --out /tmp/mirror-b.org
          diff /tmp/mirror-a.org /tmp/mirror-b.org
          grep -q "MIRROR: generated by" /tmp/mirror-a.org
      - name: The fixture tracker is untouched by read-only verbs
        run: git diff --exit-code -- tests/fixture_vault
