name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25

  quality:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  msrv:
    name: Rust 1.88 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Locked all-targets check
        run: cargo check --locked --workspace --all-targets

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Workspace tests
        run: cargo test --locked --workspace

  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@60c08ce81d769135aafd96f96efc85993d9cb8e4
      # Collect once, then report twice: the summary always prints, so a
      # gate failure says which files moved and by how much instead of
      # exiting 1 with nothing to read.
      - name: Collect coverage
        run: cargo llvm-cov --locked --workspace --all-targets --no-report
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only
      - name: Generate LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info --fail-under-lines 89
      - name: Upload LCOV artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vissue-lcov
          path: lcov.info
          if-no-files-found: error

  org-interop:
    name: Emacs reads what vissue writes
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox
      - name: Build the release binary
        run: cargo build --locked --release --bin vissue
      - name: Org interop
        run: bash tests/org_interop.sh ./target/release/vissue
      - name: Every fixture file lints as Org
        run: |
          set -euo pipefail
          for f in tests/fixture_vault/Software/*/*.org; do
            out=$(emacs --batch -Q --eval "(progn
                (require 'org-lint)
                (find-file \"$f\")
                (org-mode)
                (let ((r (org-lint)))
                  (if r
                      (dolist (x r) (princ (format \"%s\n\" (aref (cadr x) 2))))
                    (princ \"\"))))" 2>/dev/null)
            if [ -n "$out" ]; then
              echo "org-lint findings in $f: $out" >&2
              exit 1
            fi
          done

  cli-smoke:
    name: CLI smoke over the fixture tracker
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build the release binary
        run: cargo build --locked --release --bin vissue
      - name: Query and validate the fixture tracker
        run: |
          set -euo pipefail
          BIN=./target/release/vissue
          "$BIN" --version
          test "$("$BIN" --root tests/fixture_vault count)" = "6"
          test "$("$BIN" --root tests/fixture_vault count --ready)" = "3"
          "$BIN" --root tests/fixture_vault check
          "$BIN" --root tests/fixture_vault export | while read -r line; do
            printf '%s' "$line" | python3 -c 'import json,sys; json.load(sys.stdin)'
          done
      - name: Mirror is regenerable and unchanged on a second run
        run: |
          set -euo pipefail
          BIN=./target/release/vissue
          "$BIN" --root tests/fixture_vault mirror --out /tmp/mirror-a.org
          "$BIN" --root tests/fixture_vault mirror --out /tmp/mirror-b.org
          diff /tmp/mirror-a.org /tmp/mirror-b.org
          grep -q "MIRROR: generated by" /tmp/mirror-a.org
      - name: The fixture tracker is untouched by read-only verbs
        run: git diff --exit-code -- tests/fixture_vault
