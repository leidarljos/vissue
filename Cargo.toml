[workspace]
resolver = "2"
members = ["crates/vissue-core", "crates/vissue-cli", "crates/vissue-mcp"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
repository = "https://github.com/HaoZeke/vissue"
homepage = "https://github.com/HaoZeke/vissue"
readme = "README.md"
keywords = ["issue-tracker", "orgmode", "cli", "mcp", "plain-text"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
vissue-core = { version = "0.1.0", path = "crates/vissue-core" }
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
daggy = "0.9"
fs2 = "0.4"
petgraph = "0.8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# cargo-dist builds with --profile=dist
[profile.dist]
inherits = "release"
lto = "thin"

[profile.release]
lto = true
strip = true
