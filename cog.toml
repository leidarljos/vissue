from_latest_tag = true
ignore_merge_commits = true
# Towncrier owns CHANGELOG.md; cog still makes the version commit and the tag.
disable_changelog = true
disable_bump_commit = false
tag_prefix = "v"
branch_whitelist = ["main"]

pre_bump_hooks = [
    # The one hand-written version moves and takes the plugin manifest with
    # it, cogapp regenerates the other copies, the lockfile follows the
    # members, then the curated fragments become the release section, then
    # the whole gate has to pass before a tag exists. cogapp also installs a
    # `cog`, so it runs through uvx here.
    "python3 scripts/versions.py {{version}}",
    "uvx --from cogapp cog -r @cogfiles.txt",
    # `update --workspace` moves only the members' own versions;
    # `generate-lockfile` would re-resolve every dependency and ship
    # upgrades no test ran against.
    "bash -c 'cargo update --workspace --offline --quiet || cargo update --workspace --quiet'",
    # The manual page names the version, and a test holds it to `vissue man`.
    "bash -c 'cargo run -q --locked -p vissue-cli -- man > man/vissue.1'",
    "uvx towncrier build --yes --version {{version}}",
    "bash tests/release_surface.sh",
]

[commit_types]
feat = { changelog_title = "Added" }
fix = { changelog_title = "Fixed" }
docs = { changelog_title = "Documentation" }
chore = { changelog_title = "Maintenance" }
refactor = { changelog_title = "Changed" }
test = { changelog_title = "Tests" }
style = { changelog_title = "Style" }
perf = { changelog_title = "Performance" }

[changelog]
path = "CHANGELOG.md"
authors = [{ username = "HaoZeke", signature = "Rohit Goswami" }]
