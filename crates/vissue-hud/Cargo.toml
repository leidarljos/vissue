[package]
name = "vissue-hud"
description = "Summonable icedtea task board. Home is the project list."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# iced links native graphics stacks; musl archives are for the CLI and MCP.
[package.metadata.dist]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[lints]
workspace = true

[lib]
name = "vissue_hud"
path = "src/lib.rs"

[[bin]]
name = "vissue-hud"
path = "src/bin.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
iced = { version = "0.14", default-features = true, features = [
    "tokio",
    "markdown",
    "advanced",
    "lazy",
    "svg",
] }
# 0.17.0: checkbox is CheckState, label takes LabelFace, markdown_view
# takes MarkdownOpts, and drawing patterns take caller A11y. 0.16.2
# compiled, but crates.io current is 0.17 and the 0.16 signatures
# are gone.
icedtea = "0.17.0"
# Desktop notices on the Freedesktop bus; the board posts a claim, an
# unblock and a stop while it is out of view.
notify-rust = "4"
serde.workspace = true
serde_json.workspace = true
# The tray's own runtime, on its own thread.
tokio = { version = "1", features = ["rt"] }
vissue-control.workspace = true
vissue-core.workspace = true
vissue-serve.workspace = true
vissue-tui.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

# A StatusNotifier tray on Linux: left click toggles the overlay, Quit
# leaves the HUD and nothing else.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"
