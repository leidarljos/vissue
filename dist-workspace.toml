[workspace]
members = ["cargo:crates/vissue-cli", "cargo:crates/vissue-mcp"]

# Config for 'dist' (cargo-dist). `dist generate` writes the release workflow
# from this file; the checked-in release.yml is a placeholder until the first
# tag.
[dist]
cargo-dist-version = "0.30.3"
ci = "github"
installers = ["shell", "powershell"]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
pr-run-mode = "upload"
